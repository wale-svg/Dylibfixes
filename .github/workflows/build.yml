
name: Build Splatoon2Compatibility

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ARM64 dylib
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)

          mkdir -p build

          xcrun --sdk iphoneos clang \
            -dynamiclib \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=15.0 \
            -framework Foundation \
            Source/Compatibility.m \
            -o build/Splatoon2Compatibility.dylib

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: Splatoon2Compatibility
          path: build/Splatoon2Compatibility.dylib
