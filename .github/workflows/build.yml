
name: Build Splatoon2Compatibility

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Objective-C source
        run: |
          mkdir -p Source build

          cat > Source/Compatibility.m <<'OBJC'
          #import <Foundation/Foundation.h>

          static void WriteDiagnostic(NSString *message) {
              @autoreleasepool {
                  NSFileManager *manager = [NSFileManager defaultManager];

                  NSArray<NSURL *> *documents =
                      [manager URLsForDirectory:NSDocumentDirectory
                                      inDomains:NSUserDomainMask];

                  if (documents.count == 0) {
                      NSLog(@"[S2Compat] Documents directory unavailable");
                      return;
                  }

                  NSURL *directory = [documents.firstObject
                      URLByAppendingPathComponent:@"S2Compat"
                                      isDirectory:YES];

                  NSError *error = nil;

                  [manager createDirectoryAtURL:directory
                    withIntermediateDirectories:YES
                                     attributes:nil
                                          error:&error];

                  if (error) {
                      NSLog(@"[S2Compat] Directory error: %@", error);
                      return;
                  }

                  NSURL *file = [directory
                      URLByAppendingPathComponent:@"diagnostics.txt"];

                  if (![manager fileExistsAtPath:file.path]) {
                      [manager createFileAtPath:file.path
                                       contents:nil
                                     attributes:nil];
                  }

                  NSFileHandle *handle =
                      [NSFileHandle fileHandleForWritingAtPath:file.path];

                  if (!handle) {
                      NSLog(@"[S2Compat] Could not open diagnostics file");
                      return;
                  }

                  NSString *entry = [NSString stringWithFormat:
                      @"[%@] %@\n", [NSDate date], message];

                  NSData *data =
                      [entry dataUsingEncoding:NSUTF8StringEncoding];

                  @try {
                      [handle seekToEndOfFile];
                      [handle writeData:data];
                      [handle closeFile];
                  } @catch (NSException *exception) {
                      NSLog(@"[S2Compat] Write error: %@", exception);
                  }
              }
          }

          __attribute__((constructor))
          static void CompatibilityInitialize(void) {
              @autoreleasepool {
                  WriteDiagnostic(@"S2Compat loaded successfully");
                  WriteDiagnostic(@"Architecture: ARM64");
                  WriteDiagnostic(@"Diagnostic mode enabled");
                  WriteDiagnostic(@"Initialization complete");
              }
          }
          OBJC

      - name: Build ARM64 dylib
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)

          xcrun --sdk iphoneos clang \
            -dynamiclib \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=15.0 \
            -framework Foundation \
            Source/Compatibility.m \
            -o build/Splatoon2Compatibility.dylib

      - name: Verify build
        run: |
          file build/Splatoon2Compatibility.dylib
          ls -lh build/Splatoon2Compatibility.dylib

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: Splatoon2Compatibility
          path: build/Splatoon2Compatibility.dylib
