name: Build SymDump dylib

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Write source
        shell: bash
        run: |
          mkdir -p tweak
          cat > tweak/symdump.c <<'EOF'
          // Diagnostic: on load, writes the symbols of the app's own images to
          // <HOME>/Documents/tweak_symbols.txt (addresses are unslid; slide is
          // printed per image). Does not modify anything.
          #include <mach-o/dyld.h>
          #include <mach-o/loader.h>
          #include <mach-o/nlist.h>
          #include <stdio.h>
          #include <string.h>
          #include <stdint.h>
          #include <stdlib.h>

          __attribute__((constructor))
          static void symdump_main(void) {
              char path[1024];
              const char *home = getenv("HOME");
              snprintf(path, sizeof path, "%s/Documents/tweak_symbols.txt",
                       home ? home : "/tmp");
              FILE *f = fopen(path, "w");
              if (!f) return;

              uint32_t count = _dyld_image_count();
              int matched = 0;

              for (uint32_t i = 0; i < count; i++) {
                  const char *name = _dyld_get_image_name(i);
                  if (!name || !strstr(name, ".app/")) continue;

                  const struct mach_header_64 *mh =
                      (const struct mach_header_64 *)_dyld_get_image_header(i);
                  if (!mh || mh->magic != MH_MAGIC_64) continue;

                  intptr_t slide = _dyld_get_image_vmaddr_slide(i);
                  const struct symtab_command *st = NULL;
                  const struct segment_command_64 *linkedit = NULL;

                  const struct load_command *lc =
                      (const struct load_command *)(mh + 1);
                  for (uint32_t c = 0; c < mh->ncmds; c++) {
                      if (lc->cmd == LC_SYMTAB) {
                          st = (const struct symtab_command *)lc;
                      } else if (lc->cmd == LC_SEGMENT_64) {
                          const struct segment_command_64 *seg =
                              (const struct segment_command_64 *)lc;
                          if (strcmp(seg->segname, "__LINKEDIT") == 0)
                              linkedit = seg;
                      }
                      lc = (const struct load_command *)
                          ((const char *)lc + lc->cmdsize);
                  }
                  if (!st || !linkedit) continue;

                  matched++;
                  uintptr_t base = (uintptr_t)(linkedit->vmaddr + slide
                                               - linkedit->fileoff);
                  const struct nlist_64 *syms =
                      (const struct nlist_64 *)(base + st->symoff);
                  const char *strs = (const char *)(base + st->stroff);

                  fprintf(f, "# image %s slide=0x%lx nsyms=%u\n",
                          name, (long)slide, st->nsyms);
                  for (uint32_t s = 0; s < st->nsyms; s++) {
                      if (syms[s].n_type & N_STAB) continue;
                      if (syms[s].n_value == 0) continue;
                      fprintf(f, "%llx %s\n",
                              (unsigned long long)syms[s].n_value,
                              strs + syms[s].n_un.n_strx);
                  }
              }

              if (!matched) {
                  fprintf(f, "# no app images matched; all images:\n");
                  for (uint32_t i = 0; i < count; i++)
                      fprintf(f, "# %s\n", _dyld_get_image_name(i));
              }
              fclose(f);
          }
          EOF

      - name: Compile dylib (arm64, iOS)
        shell: bash
        run: |
          set -euo pipefail
          xcrun -sdk iphoneos clang \
            -arch arm64 -dynamiclib -O1 \
            -miphoneos-version-min=15.0 \
            -install_name @rpath/SymDump.dylib \
            -o SymDump.dylib tweak/symdump.c
          codesign -f -s - SymDump.dylib
          file SymDump.dylib
          ls -lh SymDump.dylib

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: SymDump-dylib
          path: SymDump.dylib
          if-no-files-found: error
          retention-days: 7
