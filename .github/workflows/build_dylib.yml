name: Build nx_diag.dylib

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Source File
        run: |
          cat << 'EOF' > diag.m
          #import <Foundation/Foundation.h>
          #include <signal.h>
          #include <stdio.h>
          #include <stdint.h>
          #include <stdlib.h>
          #include <string.h>
          #include <mach/mach.h>
          #include <mach-o/dyld.h>
          #include <sys/ucontext.h>

          static char g_log_path[1024] = {0};
          static uint64_t g_dummy_buffer[512];

          static void write_diag_log(const char *msg) {
              if (g_log_path[0] == '\0') return;
              FILE *f = fopen(g_log_path, "a");
              if (f) {
                  fputs(msg, f);
                  fflush(f);
                  fclose(f);
              }
          }

          static void segv_handler(int sig, siginfo_t *info, void *uap) {
              ucontext_t *uc = (ucontext_t *)uap;
              _STRUCT_ARM_THREAD_STATE64 *ts = &uc->uc_mcontext->__ss;

              uintptr_t pc = ts->__pc;
              write_diag_log("[NX_PATCH] Caught SIGSEGV. Forcing registers to dummy buffer and advancing PC...\n");
              
              ts->__x[20] = (uint64_t)g_dummy_buffer;
              ts->__x[8]  = (uint64_t)g_dummy_buffer;
              ts->__x[0]  = (uint64_t)g_dummy_buffer;

              // Directly advance program counter past the faulting instruction
              ts->__pc = pc + 4;
          }

          __attribute__((constructor))
          static void init_diag(void) {
              for (int i = 0; i < 512; i++) {
                  g_dummy_buffer[i] = (uint64_t)g_dummy_buffer;
              }

              NSArray *paths = NSSearchPathForDirectoriesInDomains(NSDocumentDirectory, NSUserDomainMask, YES);
              if (paths.count > 0) {
                  NSString *docDir = paths.firstObject;
                  NSString *fullPath = [docDir stringByAppendingPathComponent:@"diag_dump.txt"];
                  strncpy(g_log_path, fullPath.UTF8String, sizeof(g_log_path) - 1);
              }

              write_diag_log("=== nx_patch active advance loaded ===\n");

              struct sigaction sa;
              memset(&sa, 0, sizeof(sa));
              sa.sa_sigaction = segv_handler;
              sigemptyset(&sa.sa_mask);
              sa.sa_flags = SA_SIGINFO | SA_ONSTACK;

              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(1.0 * NSEC_PER_SEC)), dispatch_get_main_queue(), ^{
                  sigaction(SIGSEGV, &sa, NULL);
                  write_diag_log("Active advance SIGSEGV handler installed.\n");
              });
          }
          EOF

      - name: Compile Dylib
        run: |
          xcrun --sdk iphoneos clang -arch arm64 \
            -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
            -shared -fobjc-arc -framework Foundation \
            diag.m -o nx_diag.dylib
          codesign -s - nx_diag.dylib

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nx_diag-dylib
          path: nx_diag.dylib
