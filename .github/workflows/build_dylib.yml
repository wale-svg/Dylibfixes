name: build-nxdiag
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write source
        run: |
          cat > nxdiag.c << 'EOF'
          #include <signal.h>
          #include <dlfcn.h>
          #include <execinfo.h>
          #include <stdio.h>
          #include <stdint.h>
          #include <stdlib.h>
          #include <unistd.h>
          #include <sys/ucontext.h>
          #include <mach/mach.h>

          static void handler(int sig, siginfo_t *si, void *uc_) {
              ucontext_t *uc = (ucontext_t *)uc_;
              uint64_t pc = uc->uc_mcontext->__ss.__pc;
              uint64_t lr = uc->uc_mcontext->__ss.__lr;
              uint64_t x20 = uc->uc_mcontext->__ss.__x[20];
              char path[1024];
              const char *home = getenv("HOME");
              snprintf(path, sizeof path, "%s/Documents/nxdiag.log", home ? home : "/tmp");
              FILE *f = fopen(path, "a");
              if (!f) f = stderr;
              Dl_info di;
              fprintf(f, "SEGV sig=%d fa=%p pc=%llx lr=%llx x20=%llx\n",
                      sig, si->si_addr, pc, lr, x20);
              if (dladdr((void *)pc, &di))
                  fprintf(f, " pc in %s +0x%llx\n", di.dli_fname, pc - (uint64_t)di.dli_fbase);
              if (dladdr((void *)lr, &di))
                  fprintf(f, " lr in %s +0x%llx\n", di.dli_fname, lr - (uint64_t)di.dli_fbase);
              fflush(f);
              void *bt[32];
              int n = backtrace(bt, 32);
              backtrace_symbols_fd(bt, n, fileno(f));
              fflush(f);
              _exit(1);
          }

          __attribute__((constructor)) static void init(void) {
              struct sigaction sa = {0};
              sa.sa_sigaction = handler;
              sa.sa_flags = SA_SIGINFO;
              sigaction(SIGSEGV, &sa, NULL);
              sigaction(SIGBUS, &sa, NULL);
          }
          EOF

      - name: Compile and sign
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -arch arm64 -isysroot "$SDK" \
            -miphoneos-version-min=15.0 \
            -dynamiclib -O1 -g \
            -install_name @rpath/nxdiag.dylib \
            -o nxdiag.dylib nxdiag.c
          codesign -f -s - nxdiag.dylib
          file nxdiag.dylib

      - name: Inject into IPA (only if game.ipa is in the repo root)
        run: |
          if [ ! -f game.ipa ]; then echo "no game.ipa, skipping"; exit 0; fi
          git clone --depth 1 https://github.com/Tyilo/insert_dylib
          clang -o insert_dylib_bin insert_dylib/insert_dylib/main.c
          rm -rf work && mkdir work
          unzip -q game.ipa -d work
          APP=$(ls -d work/Payload/*.app | head -n1)
          EXE=$(plutil -extract CFBundleExecutable raw "$APP/Info.plist")
          mkdir -p "$APP/Frameworks"
          rm -f "$APP"/Frameworks/nx_patch*.dylib
          cp nxdiag.dylib "$APP/Frameworks/"
          ./insert_dylib_bin --inplace --strip-codesign --all-yes \
            "@executable_path/Frameworks/nxdiag.dylib" "$APP/$EXE"
          (cd work && zip -qry ../game-nxdiag.ipa Payload)

      - uses: actions/upload-artifact@v4
        with:
          name: nxdiag
          path: |
            nxdiag.dylib
            game-nxdiag.ipa
          if-no-files-found: ignore
