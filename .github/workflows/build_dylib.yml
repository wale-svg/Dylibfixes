name: Build nx_diag.dylib

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Source File
        run: |
          cat << 'EOF' > diag.m
          #import <Foundation/Foundation.h>
          #include <signal.h>
          #include <stdio.h>
          #include <stdint.h>
          #include <stdlib.h>
          #include <string.h>
          #include <mach/mach.h>
          #include <mach-o/dyld.h>
          #include <sys/ucontext.h>

          static struct sigaction old_sigsegv;
          static char g_log_path[1024] = {0};
          static uint8_t g_dummy_buffer[1024] = {0};

          static void write_diag_log(const char *msg) {
              if (g_log_path[0] == '\0') return;
              FILE *f = fopen(g_log_path, "a");
              if (f) {
                  fputs(msg, f);
                  fflush(f);
                  fclose(f);
              }
          }

          static bool safe_read_uint32(uintptr_t addr, uint32_t *out) {
              vm_size_t size = sizeof(uint32_t);
              vm_offset_t data = 0;
              mach_msg_type_number_t count = 0;
              kern_return_t kr = vm_read(mach_task_self(), (vm_address_t)addr, size, &data, &count);
              if (kr == KERN_SUCCESS && count >= sizeof(uint32_t)) {
                  *out = *(uint32_t *)data;
                  vm_deallocate(mach_task_self(), data, count);
                  return true;
              }
              return false;
          }

          static void segv_handler(int sig, siginfo_t *info, void *uap) {
              ucontext_t *uc = (ucontext_t *)uap;
              _STRUCT_ARM_THREAD_STATE64 *ts = &uc->uc_mcontext->__ss;

              uintptr_t pc = arm_thread_state64_get_pc(*ts);
              uint32_t inst_word = 0;

              if (safe_read_uint32(pc, &inst_word) && inst_word == 0xf9400288 && ts->__x[20] == 0) {
                  write_diag_log("[NX_PATCH] Caught null pointer dereference at x20! Patching with dummy buffer...\n");
                  ts->__x[20] = (uint64_t)g_dummy_buffer;
                  return;
              }

              uintptr_t lr = arm_thread_state64_get_lr(*ts);
              uintptr_t fault_addr = (uintptr_t)info->si_addr;

              char buf[512];
              snprintf(buf, sizeof(buf), "\n=== UNHANDLED SIGSEGV ===\nfa=0x%lx pc=0x%lx lr=0x%lx x20=0x%llx\n",
                       fault_addr, pc, lr, ts->__x[20]);
              write_diag_log(buf);

              if (old_sigsegv.sa_flags & SA_SIGINFO) {
                  old_sigsegv.sa_sigaction(sig, info, uap);
              } else if (old_sigsegv.sa_handler != SIG_DFL && old_sigsegv.sa_handler != SIG_IGN) {
                  old_sigsegv.sa_handler(sig);
              } else {
                  signal(SIGSEGV, SIG_DFL);
                  raise(SIGSEGV);
              }
          }

          __attribute__((constructor))
          static void init_diag(void) {
              NSArray *paths = NSSearchPathForDirectoriesInDomains(NSDocumentDirectory, NSUserDomainMask, YES);
              if (paths.count > 0) {
                  NSString *docDir = paths.firstObject;
                  NSString *fullPath = [docDir stringByAppendingPathComponent:@"diag_dump.txt"];
                  strncpy(g_log_path, fullPath.UTF8String, sizeof(g_log_path) - 1);
              }

              write_diag_log("=== nx_patch loaded ===\n");

              struct sigaction sa;
              memset(&sa, 0, sizeof(sa));
              sa.sa_sigaction = segv_handler;
              sigemptyset(&sa.sa_mask);
              sa.sa_flags = SA_SIGINFO | SA_ONSTACK;

              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(1.0 * NSEC_PER_SEC)), dispatch_get_main_queue(), ^{
                  sigaction(SIGSEGV, &sa, &old_sigsegv);
                  write_diag_log("SIGSEGV patch handler installed.\n");
              });
          }
          EOF

      - name: Compile Dylib
        run: |
          xcrun --sdk iphoneos clang -arch arm64 \
            -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
            -shared -fobjc-arc -framework Foundation \
            diag.m -o nx_diag.dylib
          codesign -s - nx_diag.dylib

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nx_diag-dylib
          path: nx_diag.dylib
